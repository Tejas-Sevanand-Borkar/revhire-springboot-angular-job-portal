# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/revhire?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Tej10@Sid
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads/resumes

# JWT Configuration
jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration=86400000

# Server Configuration
server.port=8080

# Security Headers Configuration
security.headers.frame-options=SAMEORIGIN
spring.security.headers.frame-options.disabled=true

# Logging Configuration
logging.config=classpath:log4j2.xml
logging.level.com.revhire=DEBUG
logging.level.org.springframework.security=DEBUG
