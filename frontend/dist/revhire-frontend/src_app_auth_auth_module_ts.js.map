<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Login to RevHire</mat-card-title>
      <mat-card-subtitle>Find your dream job or hire the best talent</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-field">
          <mat-form-field appearance="fill">
            <mat-label>Email</mat-label>
            <input matInput 
                   formControlName="email" 
                   placeholder="Enter your email">
            <mat-icon matSuffix>email</mat-icon>
            <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
              Email is required
            </mat-error>
            <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
              Please enter a valid email
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-field">
          <mat-form-field appearance="fill">
            <mat-label>Password</mat-label>
            <input matInput 
                   formControlName="password" 
                   [type]="hidePassword ? 'password' : 'text'"
                   placeholder="Enter your password">
            <button mat-icon-button 
                    matSuffix 
                    (click)="togglePasswordVisibility()"
                    type="button">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
              Password is required
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-actions">
          <button mat-raised-button 
                  color="primary" 
                  type="submit"
                  [disabled]="loginForm.invalid || isLoading"
                  class="submit-button">
            <span *ngIf="!isLoading">Login</span>
            <mat-spinner *ngIf="isLoading" 
                       diameter="20" 
                       class="spinner"></mat-spinner>
          </button>
        </div>
      </form>
    </mat-card-content>

    <mat-card-actions class="card-actions">
      <span class="register-prompt">
        Don't have an account? 
        <a routerLink="/auth/register" class="register-link">Register here</a>
      </span>
    </mat-card-actions>
  </mat-card>
</div>
